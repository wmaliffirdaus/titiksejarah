<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Titik Sejarah Topik Panas SPM 2026</title>
<style>
@font-face{font-family:'Marker';src:url(fonts/PermanentMarker.woff2) format('woff2')}
@font-face{font-family:'Caveat';src:url(fonts/Caveat.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Baloo';src:url(fonts/Baloo2.woff2) format('woff2');font-weight:400 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3EBDD url(paper.jpg);color:#172C63;font-family:'Baloo'}
#c::before{content:'';position:absolute;inset:0;background:
  linear-gradient(to right,transparent 58px,rgba(201,52,54,.4) 58px,rgba(201,52,54,.4) 61px,transparent 61px),
  repeating-linear-gradient(to bottom,transparent 0 62px,rgba(23,44,99,.08) 62px 64px)}
.abs{position:absolute}
.abs svg{display:block;width:100%;height:auto;overflow:visible}
.ctr{left:0;width:1080px;text-align:center}
.red{color:#C93436}
.chip{display:inline-flex;align-items:center;gap:10px;background:#172C63;color:#F5C928;font-family:'Marker';font-size:36px;padding:6px 28px 10px;border-radius:14px;box-shadow:6px 7px 0 #C93436}
.title{font-family:'Marker';font-size:104px;line-height:1;white-space:nowrap}
.hl{background:linear-gradient(to bottom,transparent 52%,#F5C928 52%,#F5C928 94%,transparent 94%);padding:0 14px}
.date{display:inline-flex;align-items:center;gap:12px;background:#C93436;color:#F3EBDD;border:4px solid #172C63;border-radius:14px;box-shadow:6px 7px 0 #172C63;padding:4px 24px 6px;font-weight:800;font-size:32px;transform:rotate(-1deg)}
.date svg{width:38px;display:block}
.list{left:70px;top:520px;width:950px;display:flex;flex-direction:column;gap:12px}
.card{display:flex;align-items:center;height:124px;box-sizing:border-box;background:#FFFDF7;border:4px solid #172C63;border-radius:22px;padding:0 20px 0 16px}
.rk{width:74px;height:74px;border-radius:50%;background:#172C63;color:#F5C928;font-family:'Marker';font-size:40px;display:flex;align-items:center;justify-content:center;flex:none}
.mid{flex:1;margin-left:18px;min-width:0}
.bab{font-weight:800;font-size:22px;letter-spacing:1px;color:#C93436;line-height:1}
.nm{font-weight:800;font-size:36px;line-height:1.05;white-space:nowrap;margin-top:4px}
.why{font-weight:600;font-size:22px;line-height:1.1;color:rgba(23,44,99,.8);margin-top:4px;white-space:nowrap}
.yrs{flex:none;text-align:center;width:196px}
.yrs .row{display:flex;gap:6px;justify-content:center}
.y{width:58px;height:44px;border-radius:10px;border:3px solid #172C63;font-weight:800;font-size:22px;line-height:40px;color:rgba(23,44,99,.35);background:transparent}
.y.on{background:#C93436;color:#F3EBDD}
.yrs .cap{font-weight:700;font-size:19px;margin-top:5px;color:rgba(23,44,99,.8)}
.top{height:150px;background:#F5C928;border-width:5px;box-shadow:9px 10px 0 #172C63}
.top .rk{background:#C93436;color:#F3EBDD}
.top .why{color:#172C63;font-weight:800}
.top .y:not(.on){background:#FFFDF7}
.tip{left:70px;width:950px;top:1405px;box-sizing:border-box;background:#172C63;color:#F3EBDD;border-radius:22px;border:4px solid #172C63;box-shadow:8px 9px 0 #F5C928;padding:14px 26px 16px;display:flex;align-items:center;gap:20px}
.tip svg{width:74px;flex:none;display:block}
.tip .h{font-family:'Marker';font-size:34px;color:#F5C928;line-height:1.05}
.tip .b{font-weight:700;font-size:28px;line-height:1.2}
.disc{left:70px;width:950px;top:1560px;text-align:center;font-weight:600;font-size:23px;line-height:1.3;color:rgba(23,44,99,.85)}
.disc b{font-weight:800;color:#C93436}
.foot{left:70px;width:950px;top:1665px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand .dp{width:96px;height:96px;border:5px solid #172C63;background:#fff url(../assets/brand/titik-sejarah-dp-square.jpg) center/cover;box-shadow:6px 7px 0 #172C63;flex:none}
.brand .t{font-family:'Marker';font-size:42px;line-height:.95}
.brand .tg{font-family:'Caveat';font-weight:700;font-size:30px;color:#C93436;margin-top:4px}
.cta{display:flex;align-items:center;gap:12px;background:#C93436;color:#F3EBDD;border:4px solid #172C63;border-radius:20px;box-shadow:7px 8px 0 #172C63;padding:8px 20px 10px;transform:rotate(-1.5deg)}
.cta .l1{font-weight:700;font-size:22px;line-height:1.1}
.cta .l2{font-family:'Marker';font-size:40px;line-height:1.05;color:#F5C928}
.cta svg{width:52px;display:block}
</style>
<script src="../node_modules/roughjs/bundled/rough.js"></script>
</head>
<body>
<div id="c"></div>
<script type="module">
import { D, R, C, setSeed } from './doodles.js';
const c = document.getElementById('c');
const add = (html, css, cls = 'abs') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; c.appendChild(d); return d; };
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
await document.fonts.ready;
setSeed(2026);

const flame = svg(80, 100, R.path('M40 96 Q8 92 10 60 Q12 36 30 18 Q30 40 42 44 Q38 20 54 4 Q58 30 70 44 Q80 60 72 78 Q64 96 40 96 Z', { fill: C.gold, strokeWidth: 4, stroke: C.navy }) +
  R.path('M40 92 Q24 88 26 70 Q28 58 38 50 Q40 64 48 66 Q58 74 54 84 Q50 92 40 92 Z', { fill: C.red, strokeWidth: 3, stroke: C.navy }));

// 1) Header
add(`<span class="chip">ANALISIS KERTAS 2 · SPM 2022–2024</span>`, 'top:160px;transform:rotate(-2deg)', 'abs ctr');
add(`TOPIK <span class="red">PANAS</span>`, 'top:232px;transform:rotate(-2deg)', 'abs ctr title');
add(`<span class="hl">SPM SEJARAH 2026</span>`, 'top:340px;transform:rotate(-2deg);font-size:84px', 'abs ctr title');
add(`<div style="width:90px">${flame}</div>`, 'left:68px;top:240px;transform:rotate(-12deg)');
add(`<div style="width:80px">${flame}</div>`, 'left:935px;top:240px;transform:rotate(10deg)');
const cal = svg(110, 110, `<rect x="8" y="18" width="94" height="84" rx="8" fill="#F3EBDD"/><rect x="8" y="18" width="94" height="26" rx="8" fill="${C.navy}"/><text x="55" y="90" font-family="Marker" font-size="40" fill="${C.navy}" text-anchor="middle">30</text>`);
add(`<span class="date">${cal}Kertas 1 &amp; 2: Isnin, 30 November 2026</span>`, 'top:448px', 'abs ctr');

// 2) Six high-priority areas (from the analysis; years = appeared in Kertas 2)
const T = [
  ['T5 · BAB 9', 'Dasar Luar Malaysia', 'Soalan 9 Bahagian B SETIAP tahun!', [1, 1, 1], true],
  ['T5 · BAB 7', 'Membina Kesejahteraan Negara', 'Bahagian A 3 tahun berturut-turut', [1, 1, 1]],
  ['T4 · BAB 3', 'Konflik Dunia & Pendudukan Jepun', 'Keluar sebagai esei & soalan struktur', [1, 1, 1]],
  ['T5 · BAB 2', 'Perlembagaan Persekutuan', 'Esei 20 markah pada 2022 & 2024', [1, 0, 1]],
  ['T4 · BAB 2', 'Kebangkitan Nasionalisme', 'Kesan politik & ekonomi: ramai hilang markah', [0, 1, 1]],
  ['T5 · BAB 5 & 6', 'Pembentukan Malaysia & Cabaran', 'Esei 2022 & 2023 · ulang kaji sekali gus', [1, 1, 1]],
];
add(T.map(([bab, nm, why, yrs, top], i) => `
  <div class="card${top ? ' top' : ''}">
    <div class="rk">${i + 1}</div>
    <div class="mid"><div class="bab">${bab}</div><div class="nm">${nm}</div><div class="why">${why}</div></div>
    <div class="yrs"><div class="row">${['22', '23', '24'].map((y, k) => `<span class="y${yrs[k] ? ' on' : ''}">${y}</span>`).join('')}</div><div class="cap">Keluar ${yrs.reduce((a, b) => a + b)}/3 tahun</div></div>
  </div>`).join(''), '', 'abs list');

// 3) KBAT tip from the examiner-report findings
add(`${D.bulb()}<div><div class="h">TIP KBAT</div><div class="b">Jangan jawab guna logik sahaja: nyatakan idea, sokong dengan <span style="color:#F5C928">fakta sejarah</span>, kemudian huraikan.</div></div>`, '', 'abs tip');

// 4) Honest disclaimer
add('Analisis berdasarkan Kertas 2 SPM 2022–2024 &amp; laporan pemeriksa. <b>Bukan ramalan rasmi.</b><br>Kertas 1 menguji semua 20 bab: ulang kaji semua bab!', '', 'abs disc');

// 5) Brand + CTA
add(`<div class="brand"><div class="dp"></div><div><div class="t">TITIK <span class="red">SEJARAH</span></div><div class="tg">Kenali sejarah, fahami masa kini.</div></div></div>
  <div class="cta"><svg viewBox="0 0 120 110"><path d="M10 14 Q10 4 22 4 L98 4 Q110 4 110 16 L110 64 Q110 76 98 76 L50 76 L24 102 L28 76 L22 76 Q10 76 10 64 Z" fill="#F3EBDD" stroke="#172C63" stroke-width="5"/><circle cx="38" cy="40" r="7" fill="#C93436"/><circle cx="60" cy="40" r="7" fill="#C93436"/><circle cx="82" cy="40" r="7" fill="#C93436"/></svg>
  <div><div class="l1">Nak nota &amp; bank soalan?</div><div class="l2">PM di TikTok</div></div></div>`, '', 'abs foot');

await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
window.__done = true;
</script>
</body>
</html>

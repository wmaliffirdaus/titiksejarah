<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Titik Sejarah Topik Panas Promo 50%</title>
<style>
@font-face{font-family:'Marker';src:url(fonts/PermanentMarker.woff2) format('woff2')}
@font-face{font-family:'Caveat';src:url(fonts/Caveat.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Baloo';src:url(fonts/Baloo2.woff2) format('woff2');font-weight:400 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3EBDD url(paper.jpg);color:#172C63;font-family:'Baloo'}
#c::before{content:'';position:absolute;inset:0;background:
  linear-gradient(to right,transparent 58px,rgba(201,52,54,.4) 58px,rgba(201,52,54,.4) 61px,transparent 61px),
  repeating-linear-gradient(to bottom,transparent 0 62px,rgba(23,44,99,.08) 62px 64px)}
.abs{position:absolute}
.abs svg{display:block;width:100%;height:auto;overflow:visible}
.ctr{left:0;width:1080px;text-align:center}
.red{color:#C93436}
.chip{display:inline-block;background:#172C63;color:#F5C928;font-family:'Marker';font-size:36px;padding:6px 28px 10px;border-radius:14px;box-shadow:6px 7px 0 #C93436}
.t1{font-family:'Marker';font-size:70px;line-height:1;white-space:nowrap}
.hl{background:linear-gradient(to bottom,transparent 52%,#F5C928 52%,#F5C928 94%,transparent 94%);padding:0 14px}
.grid{left:70px;top:440px;width:950px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tp{display:flex;align-items:center;gap:12px;background:#FFFDF7;border:4px solid #172C63;border-radius:16px;padding:8px 14px;height:86px;box-sizing:border-box}
.tp .n{width:48px;height:48px;border-radius:50%;background:#172C63;color:#F5C928;font-family:'Marker';font-size:26px;display:flex;align-items:center;justify-content:center;flex:none}
.tp.top .n{background:#C93436;color:#F3EBDD}
.tp .b{font-weight:800;font-size:17px;letter-spacing:1px;color:#C93436;line-height:1}
.tp .m{font-weight:800;font-size:25px;line-height:1.05;white-space:nowrap}
.mid{font-family:'Caveat';font-weight:700;font-size:56px;color:#C93436;line-height:1}
.pak{left:110px;width:860px;top:900px;height:470px;box-sizing:border-box;background:#F5C928;border:6px solid #172C63;border-radius:30px;box-shadow:12px 14px 0 #172C63;padding:30px 36px}
.pak .tag{display:inline-block;background:#C93436;color:#F3EBDD;font-weight:800;font-size:24px;letter-spacing:2px;padding:4px 14px;border-radius:8px;transform:rotate(-3deg)}
.pak .nm{font-family:'Marker';font-size:72px;line-height:1.05;margin-top:10px}
.pak .inc{font-weight:800;font-size:30px;line-height:1.25;margin-top:6px}
.pak .sub{font-weight:700;font-size:27px;line-height:1.25;margin-top:16px;color:#172C63;max-width:560px}
.pak .inc span{display:inline-block;background:#FFFDF7;border:3px solid #172C63;border-radius:999px;padding:0 16px;margin:6px 6px 0 0;font-size:26px}
.pak .pr{position:absolute;left:36px;bottom:26px;display:flex;align-items:baseline;gap:18px}
.pak .now{font-weight:800;font-size:110px;line-height:.9;color:#172C63}
.pak .now small{font-size:40px;margin-right:4px}
.pak .was{font-weight:800;font-size:40px;text-decoration:line-through;text-decoration-color:#C93436;text-decoration-thickness:4px;color:rgba(23,44,99,.6)}
.big{font-family:'Marker';font-size:96px;line-height:1;color:#F5C928;-webkit-text-stroke:7px #172C63;paint-order:stroke fill;text-shadow:6px 7px 0 #172C63}
.from{font-weight:800;font-size:36px;line-height:1.1}
.from b{color:#C93436;font-size:44px}
.end{left:0;width:1080px;top:1508px;display:flex;justify-content:center}
.end .box{display:flex;align-items:center;gap:14px;background:#172C63;color:#F3EBDD;border:5px solid #C93436;border-radius:18px;box-shadow:8px 9px 0 #F5C928;padding:8px 26px 10px;transform:rotate(-1deg)}
.end .box svg{width:54px;display:block}
.end .l1{font-family:'Marker';font-size:38px;color:#F5C928;line-height:1.05;white-space:nowrap}
.end .l2{font-weight:700;font-size:26px;line-height:1.1}
.foot{left:70px;width:950px;top:1690px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand .dp{width:96px;height:96px;border:5px solid #172C63;background:#fff url(../assets/brand/titik-sejarah-dp-square.jpg) center/cover;box-shadow:6px 7px 0 #172C63;flex:none}
.brand .t{font-family:'Marker';font-size:42px;line-height:.95}
.brand .tg{font-family:'Caveat';font-weight:700;font-size:30px;color:#C93436;margin-top:4px}
.cta{display:flex;align-items:center;gap:12px;background:#C93436;color:#F3EBDD;border:4px solid #172C63;border-radius:20px;box-shadow:7px 8px 0 #172C63;padding:8px 22px 10px;transform:rotate(-1.5deg)}
.cta .l1{font-weight:700;font-size:24px;line-height:1}
.cta .l2{font-family:'Marker';font-size:42px;line-height:1.05;color:#F5C928}
.cta svg{width:54px;display:block}
</style>
<script src="../node_modules/roughjs/bundled/rough.js"></script>
</head>
<body>
<div id="c"></div>
<script type="module">
import { D, R, C, setSeed } from './doodles.js';
const c = document.getElementById('c');
const add = (html, css, cls = 'abs') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; c.appendChild(d); return d; };
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
await document.fonts.ready;
setSeed(5050);

// 1) Header
add('<span class="chip">TOPIK PANAS SPM 2026 + PROMO 50%</span>', 'top:160px;transform:rotate(-2deg)', 'abs ctr');
add('DAH TAHU <span class="red">TOPIK PANAS?</span>', 'top:245px;transform:rotate(-2deg)', 'abs ctr t1');
add('<span class="hl">JOM KUASAI SEKARANG!</span>', 'top:328px;transform:rotate(-2deg);font-size:66px', 'abs ctr t1');

// 2) The six high-priority areas (from the topic analysis poster)
const T = [['T5 · BAB 9', 'Dasar Luar Malaysia', 1], ['T5 · BAB 7', 'Kesejahteraan Negara'], ['T4 · BAB 3', 'Konflik Dunia & Jepun'],
  ['T5 · BAB 2', 'Perlembagaan Persekutuan'], ['T4 · BAB 2', 'Kebangkitan Nasionalisme'], ['T5 · BAB 5 & 6', 'Pembentukan Malaysia']];
add(T.map(([b, m, top], i) => `<div class="tp${top ? ' top' : ''}"><div class="n">${i + 1}</div><div><div class="b">${b}</div><div class="m">${m}</div></div></div>`).join(''), '', 'abs grid');

// 3) Bridge line + arrow
add('Ulang kaji semua topik ini dengan...', 'top:745px', 'abs ctr mid');
add(D.arrow(40, 10, 50, 100, { w: 100, h: 110, color: C.red, sw: 8, bend: 0.25 }), 'left:500px;top:800px;width:80px');

// 4) Hero package card (B7, 50% off)
add(`<span class="tag">TERBAIK · 120 FAIL</span>
  <div class="nm">PAKEJ LENGKAP</div>
  <div class="inc"><span>Nota T4 + T5</span><span>Kertas 1</span><span>Kertas 2</span><span>Peta Minda</span></div>
  <div class="sub">Bahan ulang kaji SPM Sejarah KSSM<br>Tingkatan 4 &amp; 5 · format PDF</div>
  <div class="pr"><div class="now"><small>RM</small>24.95</div><div class="was">RM49.90</div></div>`, '', 'abs pak');
{
  const pts = []; const n = 18;
  for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 108 : 132; pts.push([140 + r * Math.cos(a), 140 + r * Math.sin(a)]); }
  add(svg(280, 280, R.poly(pts.map(([x, y]) => [x + 8, y + 10]), { fill: C.navy, stroke: C.navy, roughness: 0.6 }) + R.poly(pts, { fill: C.red, strokeWidth: 5, roughness: 0.7 })), 'left:720px;top:1120px;width:280px;transform:rotate(-8deg)');
  add('<div class="big">50%</div><div style="font-family:Marker;font-size:40px;color:#F3EBDD;line-height:1">OFF</div>', 'left:720px;width:280px;top:1172px;text-align:center;transform:rotate(-8deg)');
}
add(D.star(C.red), 'left:60px;top:880px;width:90px;transform:rotate(-12deg)');

// 5) Cheaper option
add('Pakej lain dari <b>RM6.45</b> sahaja!', 'top:1415px', 'abs ctr from');

// 6) Deadline twist
const cal = svg(110, 110, `<rect x="8" y="18" width="94" height="84" rx="8" fill="#F3EBDD"/><rect x="8" y="18" width="94" height="26" rx="8" fill="${C.red}"/><text x="55" y="90" font-family="Marker" font-size="40" fill="${C.navy}" text-anchor="middle">30</text>`);
add(`<div class="box">${cal}<div><div class="l1">PROMO TAMAT 30 NOVEMBER 2026</div><div class="l2">Hari yang sama dengan SPM Sejarah. Jangan tunggu!</div></div></div>`, '', 'abs end');

// 7) Brand + CTA
add(`<div class="brand"><div class="dp"></div><div><div class="t">TITIK <span class="red">SEJARAH</span></div><div class="tg">Kenali sejarah, fahami masa kini.</div></div></div>
  <div class="cta"><svg viewBox="0 0 120 110"><path d="M10 14 Q10 4 22 4 L98 4 Q110 4 110 16 L110 64 Q110 76 98 76 L50 76 L24 102 L28 76 L22 76 Q10 76 10 64 Z" fill="#F3EBDD" stroke="#172C63" stroke-width="5"/><circle cx="38" cy="40" r="7" fill="#C93436"/><circle cx="60" cy="40" r="7" fill="#C93436"/><circle cx="82" cy="40" r="7" fill="#C93436"/></svg>
  <div><div class="l1">Nak beli?</div><div class="l2">PM di TikTok</div></div></div>`, '', 'abs foot');

await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
window.__done = true;
</script>
</body>
</html>

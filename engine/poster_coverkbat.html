<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Titik Sejarah Repost Frame KBAT</title>
<style>
@font-face{font-family:'Marker';src:url(fonts/PermanentMarker.woff2) format('woff2')}
@font-face{font-family:'Caveat';src:url(fonts/Caveat.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Baloo';src:url(fonts/Baloo2.woff2) format('woff2');font-weight:400 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
/* Same notebook-paper base as the other Story posters */
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3EBDD url(paper.jpg);color:#172C63}
#c::before{content:'';position:absolute;inset:0;background:
  linear-gradient(to right,transparent 108px,rgba(201,52,54,.4) 108px,rgba(201,52,54,.4) 111px,transparent 111px),
  repeating-linear-gradient(to bottom,transparent 0 62px,rgba(23,44,99,.08) 62px 64px)}
.abs{position:absolute}
.abs svg{display:block;width:100%;height:auto;overflow:visible}
.ctr{left:0;width:1080px;text-align:center}
.red{color:#C93436}
.chip{display:inline-flex;align-items:center;gap:10px;background:#C93436;color:#F3EBDD;font-family:'Marker';font-size:38px;padding:4px 26px 8px;border-radius:12px;border:4px solid #172C63;box-shadow:6px 7px 0 #172C63}
.chip svg{width:32px;display:block}
.title{font-family:'Marker';font-size:72px;line-height:1;white-space:nowrap}
.hl{background:linear-gradient(to bottom,transparent 52%,#F5C928 52%,#F5C928 94%,transparent 94%);padding:0 12px}
/* the window where the reposted video card goes (inner 640 x 1138, i.e. 9:16) */
.win{left:212px;top:390px;width:656px;height:1154px;box-sizing:border-box;border:8px solid #172C63;border-radius:30px;background:#FFFDF7;box-shadow:14px 16px 0 #F5C928}
.tape{position:absolute;width:150px;height:44px;background:rgba(243,235,221,.92);border:2px solid rgba(23,44,99,.15)}
.tap{font-family:'Caveat';font-weight:700;font-size:50px;line-height:1;color:#C93436}
.foot{left:0;width:1080px;top:1690px;display:flex;justify-content:center;align-items:center;gap:16px}
.foot .dp{width:84px;height:84px;border:5px solid #172C63;background:#fff url(../assets/brand/titik-sejarah-dp-square.jpg) center/cover;box-shadow:6px 7px 0 #172C63;flex:none}
.foot .t{font-family:'Marker';font-size:44px;line-height:.95}
.foot .tg{font-family:'Caveat';font-weight:700;font-size:30px;color:#C93436;margin-top:4px}
</style>
<script src="../node_modules/roughjs/bundled/rough.js"></script>
</head>
<body>
<div id="c"></div>
<script type="module">
import { D, R, C, setSeed } from './doodles.js';
const c = document.getElementById('c');
const add = (html, css, cls = 'abs') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; c.appendChild(d); return d; };
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
await document.fonts.ready;
setSeed(77);

// 1) Gold sunburst radiating from behind the video window
add(D.burst(), 'left:-460px;top:-20px;width:2000px', 'abs');

// 2) Header
const flame = svg(80, 100, R.path('M40 96 Q8 92 10 60 Q12 36 30 18 Q30 40 42 44 Q38 20 54 4 Q58 30 70 44 Q80 60 72 78 Q64 96 40 96 Z', { fill: C.gold, strokeWidth: 4, stroke: C.navy }) +
  R.path('M40 92 Q24 88 26 70 Q28 58 38 50 Q40 64 48 66 Q58 74 54 84 Q50 92 40 92 Z', { fill: C.red, strokeWidth: 3, stroke: C.navy }));
add(`<span class="chip">${flame}EPISOD KHAS${flame}</span>`, 'top:178px;transform:rotate(-2deg)', 'abs ctr');
add('TEKNIK JAWAB <span class="hl"><span class="red">KBAT</span></span>', 'top:262px;transform:rotate(-1.5deg)', 'abs ctr title');

// 3) Video window (place the reposted Story card here)
add('', '', 'abs win');
add('', 'left:178px;top:372px;transform:rotate(-35deg)', 'abs tape');
add('', 'left:752px;top:372px;transform:rotate(35deg)', 'abs tape');
add('', 'left:178px;top:1520px;transform:rotate(35deg)', 'abs tape');
add('', 'left:752px;top:1520px;transform:rotate(-35deg)', 'abs tape');

// 4) Doodles in the side margins (kept outside the window)
add(D.bulb(), 'left:40px;top:470px;width:130px;transform:rotate(-10deg)');
add(D.question(C.red), 'left:80px;top:770px;width:70px;transform:rotate(-8deg)');
add(D.star(C.gold), 'left:40px;top:1030px;width:120px;transform:rotate(-12deg)');
add(D.star(C.red), 'left:915px;top:470px;width:110px;transform:rotate(12deg)');
add(D.book('KBAT', C.red, { size: 40, y: 145 }), 'left:900px;top:700px;width:160px;transform:rotate(8deg)');
add(D.check(C.navy), 'left:925px;top:1060px;width:100px');
add(D.rakyat({ pose: 'cheer' }), 'left:25px;top:1280px;width:175px;transform:rotate(-6deg)');
add(D.heart(C.red), 'left:920px;top:1320px;width:110px;transform:rotate(10deg)');

// 5) Footer: tap prompt + brand (below the "@username" line the repost adds)
add('Tap untuk tonton video penuh!', 'top:1622px', 'abs ctr tap');
add('<div class="dp"></div><div><div class="t">TITIK <span class="red">SEJARAH</span></div><div class="tg">Kenali sejarah, fahami masa kini.</div></div>', '', 'abs foot');

await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
window.__done = true;
</script>
</body>
</html>

<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<title>Titik Sejarah Kertas 1 Promo</title>
<style>
@font-face{font-family:'Marker';src:url(fonts/PermanentMarker.woff2) format('woff2')}
@font-face{font-family:'Caveat';src:url(fonts/Caveat.woff2) format('woff2');font-weight:400 700}
@font-face{font-family:'Baloo';src:url(fonts/Baloo2.woff2) format('woff2');font-weight:400 800}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
#c{position:relative;width:1080px;height:1920px;overflow:hidden;background:#F3EBDD url(paper.jpg);color:#172C63;font-family:'Baloo'}
#c::before{content:'';position:absolute;inset:0;background:
  linear-gradient(to right,transparent 58px,rgba(201,52,54,.4) 58px,rgba(201,52,54,.4) 61px,transparent 61px),
  repeating-linear-gradient(to bottom,transparent 0 62px,rgba(23,44,99,.08) 62px 64px)}
.abs{position:absolute}
.abs svg{display:block;width:100%;height:auto;overflow:visible}
.ctr{left:0;width:1080px;text-align:center}
.red{color:#C93436}
.chip{display:inline-block;background:#C93436;color:#F3EBDD;font-family:'Marker';font-size:44px;padding:6px 30px 10px;border-radius:14px;border:4px solid #172C63;box-shadow:6px 7px 0 #172C63}
.h1{font-family:'Marker';font-size:78px;line-height:1;white-space:nowrap}
.hl{background:linear-gradient(to bottom,transparent 52%,#F5C928 52%,#F5C928 94%,transparent 94%);padding:0 14px}
.vid{left:90px;top:400px;width:400px;box-sizing:border-box;padding:12px;background:#172C63;border-radius:24px;box-shadow:10px 12px 0 #F5C928;transform:rotate(-3deg)}
.vid img{display:block;width:100%;border-radius:14px}
.play{position:absolute;left:50%;top:50%;width:120px;height:120px;margin:-60px 0 0 -60px;border-radius:50%;background:#C93436;border:6px solid #F3EBDD;box-shadow:0 6px 0 #172C63;display:flex;align-items:center;justify-content:center}
.play::after{content:'';margin-left:10px;border-left:42px solid #F3EBDD;border-top:26px solid transparent;border-bottom:26px solid transparent}
.tape{position:absolute;width:140px;height:42px;background:rgba(243,235,221,.92);border:2px solid rgba(23,44,99,.15)}
.side{left:540px;top:430px;width:480px}
.side .q{font-family:'Marker';font-size:56px;line-height:1.05}
.side .li{display:flex;align-items:center;gap:12px;font-weight:800;font-size:30px;line-height:1.15;margin-top:18px}
.side .li .ck{width:40px;flex:none}
.watch{font-family:'Caveat';font-weight:700;font-size:46px;color:#C93436;line-height:1.05;margin-top:24px}
.pak{left:90px;width:900px;top:1150px;height:400px;box-sizing:border-box;background:#F5C928;border:6px solid #172C63;border-radius:30px;box-shadow:12px 14px 0 #172C63;padding:26px 34px}
.pak .tag{display:inline-block;background:#172C63;color:#F5C928;font-weight:800;font-size:24px;letter-spacing:2px;padding:4px 14px;border-radius:8px;transform:rotate(-3deg)}
.pak .nm{font-family:'Marker';font-size:68px;line-height:1.05;margin-top:10px}
.pak .inc span{display:inline-block;background:#FFFDF7;border:3px solid #172C63;border-radius:999px;padding:0 16px;margin:8px 8px 0 0;font-weight:800;font-size:26px}
.pak .pr{position:absolute;left:34px;bottom:24px;display:flex;align-items:baseline;gap:18px}
.pak .now{font-weight:800;font-size:120px;line-height:.9;color:#C93436}
.pak .now small{font-size:42px;margin-right:4px;color:#172C63}
.pak .was{font-weight:800;font-size:42px;text-decoration:line-through;text-decoration-color:#C93436;text-decoration-thickness:4px;color:rgba(23,44,99,.6)}
.big{font-family:'Marker';font-size:92px;line-height:1;color:#F5C928;-webkit-text-stroke:7px #172C63;paint-order:stroke fill;text-shadow:6px 7px 0 #172C63}
.end{left:0;width:1080px;top:1600px;display:flex;justify-content:center}
.end .box{display:flex;align-items:center;gap:14px;background:#172C63;color:#F3EBDD;border:5px solid #C93436;border-radius:18px;box-shadow:8px 9px 0 #F5C928;padding:8px 26px 10px;transform:rotate(-1deg)}
.end .box svg{width:50px;display:block}
.end .l1{font-family:'Marker';font-size:36px;color:#F5C928;line-height:1.05;white-space:nowrap}
.end .l2{font-weight:700;font-size:25px;line-height:1.1}
.foot{left:70px;width:950px;top:1730px;display:flex;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:16px}
.brand .dp{width:96px;height:96px;border:5px solid #172C63;background:#fff url(../assets/brand/titik-sejarah-dp-square.jpg) center/cover;box-shadow:6px 7px 0 #172C63;flex:none}
.brand .t{font-family:'Marker';font-size:42px;line-height:.95}
.brand .tg{font-family:'Caveat';font-weight:700;font-size:30px;color:#C93436;margin-top:4px}
.cta{display:flex;align-items:center;gap:12px;background:#C93436;color:#F3EBDD;border:4px solid #172C63;border-radius:20px;box-shadow:7px 8px 0 #172C63;padding:8px 22px 10px;transform:rotate(-1.5deg)}
.cta .l1{font-weight:700;font-size:24px;line-height:1}
.cta .l2{font-family:'Marker';font-size:42px;line-height:1.05;color:#F5C928}
.cta svg{width:54px;display:block}
</style>
<script src="../node_modules/roughjs/bundled/rough.js"></script>
</head>
<body>
<div id="c"></div>
<script type="module">
import { D, R, C, setSeed } from './doodles.js';
const c = document.getElementById('c');
const add = (html, css, cls = 'abs') => { const d = document.createElement('div'); d.className = cls; d.style.cssText = css; d.innerHTML = html; c.appendChild(d); return d; };
const svg = (w, h, body) => `<svg viewBox="0 0 ${w} ${h}" xmlns="http://www.w3.org/2000/svg">${body}</svg>`;
await document.fonts.ready;
setSeed(1249);

// 1) Header
add('<span class="chip">VIDEO BARU DAH KELUAR!</span>', 'top:140px;transform:rotate(-2deg)', 'abs ctr');
add('EPISOD KHAS <span class="hl"><span class="red">KERTAS 1</span></span>', 'top:240px;transform:rotate(-2deg)', 'abs ctr h1');

// 2) Video thumbnail (the episode cover) with a play button
add('<img src="../assets/episod/kertas1_cover.jpg"><div class="play"></div>', '', 'abs vid');
add('', 'left:120px;top:385px;transform:rotate(-14deg)', 'tape');
add('', 'left:360px;top:375px;transform:rotate(10deg)', 'tape');

// 3) What the episode covers + nudge
const ck = D.check(C.red);
add(`<div class="q">Nak score <span class="red">30+</span> dalam Kertas 1?</div>
  <div class="li"><div class="ck">${ck}</div>40 soalan · 1 jam</div>
  <div class="li"><div class="ck">${ck}</div>Cara menjawab dengan betul</div>
  <div class="watch">Tonton episod penuh di TikTok Titik Sejarah!</div>`, '', 'abs side');
add(D.arrow(10, 10, 90, 90, { w: 100, h: 100, color: C.red, sw: 7, bend: 0.3 }), 'left:520px;top:1020px;width:90px;transform:rotate(10deg)');

// 4) Offer: B2 Pakej Kertas 1 at 50% off
add(`<span class="tag">LEPAS TONTON, TERUS LATIH!</span>
  <div class="nm">PAKEJ KERTAS 1</div>
  <div class="inc"><span>40 fail</span><span>Kertas 1: T4 + Penuh</span><span>PDF</span></div>
  <div class="pr"><div class="now"><small>RM</small>7.95</div><div class="was">RM15.90</div></div>`, '', 'abs pak');
{
  const pts = []; const n = 18;
  for (let i = 0; i < n * 2; i++) { const a = (i / (n * 2)) * Math.PI * 2 - Math.PI / 2, r = i % 2 ? 108 : 132; pts.push([140 + r * Math.cos(a), 140 + r * Math.sin(a)]); }
  add(svg(280, 280, R.poly(pts.map(([x, y]) => [x + 8, y + 10]), { fill: C.navy, stroke: C.navy, roughness: 0.6 }) + R.poly(pts, { fill: C.red, strokeWidth: 5, roughness: 0.7 })), 'left:720px;top:1300px;width:280px;transform:rotate(-8deg)');
  add('<div class="big">50%</div><div style="font-family:Marker;font-size:40px;color:#F3EBDD;line-height:1">OFF</div>', 'left:720px;width:280px;top:1352px;text-align:center;transform:rotate(-8deg)');
}
add(D.star(C.red), 'left:55px;top:1120px;width:80px;transform:rotate(-12deg)');

// 5) Deadline
const cal = svg(110, 110, `<rect x="8" y="18" width="94" height="84" rx="8" fill="#F3EBDD"/><rect x="8" y="18" width="94" height="26" rx="8" fill="${C.red}"/><text x="55" y="90" font-family="Marker" font-size="40" fill="${C.navy}" text-anchor="middle">30</text>`);
add(`<div class="box">${cal}<div><div class="l1">PROMO TAMAT 30 NOVEMBER 2026</div><div class="l2">Tinggal beberapa hari sahaja sebelum SPM Sejarah!</div></div></div>`, '', 'abs end');

// 6) Brand + CTA
add(`<div class="brand"><div class="dp"></div><div><div class="t">TITIK <span class="red">SEJARAH</span></div><div class="tg">Kenali sejarah, fahami masa kini.</div></div></div>
  <div class="cta"><svg viewBox="0 0 120 110"><path d="M10 14 Q10 4 22 4 L98 4 Q110 4 110 16 L110 64 Q110 76 98 76 L50 76 L24 102 L28 76 L22 76 Q10 76 10 64 Z" fill="#F3EBDD" stroke="#172C63" stroke-width="5"/><circle cx="38" cy="40" r="7" fill="#C93436"/><circle cx="60" cy="40" r="7" fill="#C93436"/><circle cx="82" cy="40" r="7" fill="#C93436"/></svg>
  <div><div class="l1">Nak beli?</div><div class="l2">PM di TikTok</div></div></div>`, '', 'abs foot');

await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
await Promise.all([...document.images].map((im) => (im.complete ? 0 : new Promise((r) => (im.onload = im.onerror = r)))));
window.__done = true;
</script>
</body>
</html>
